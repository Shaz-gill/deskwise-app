services:
   postgres:
      image: postgres:16-alpine
      restart: unless-stopped
      environment:
         POSTGRES_USER: ${POSTGRES_USER}
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
         POSTGRES_DB: ${POSTGRES_DB}
      volumes:
         - pgdata:/var/lib/postgresql/data
      networks: [internal]

   app:
      # `image:` lets CD skip the build entirely and just pull what CI already
      # built and pushed (see .github/workflows/) — `docker compose pull && up
      # -d`, no source checkout needed on the host. `build:` stays alongside
      # it purely so `docker compose build` still works for a manual/local
      # deploy with no CI involved; it's unused by the normal CD path.
      image: ${ECR_REGISTRY}/deskwise-server:${IMAGE_TAG:-latest}
      build:
         context: .
         dockerfile: packages/server/Dockerfile
      restart: unless-stopped
      env_file: .env
      environment:
         NODE_ENV: production
         PORT: 3000
      depends_on:
         - postgres
      networks: [internal]

   web:
      # Same build/image split as `app` above — VITE_* args only matter for
      # the local `build:` path, since CI bakes them in when it builds the
      # pushed image.
      image: ${ECR_REGISTRY}/deskwise-client:${IMAGE_TAG:-latest}
      build:
         context: .
         dockerfile: packages/client/Dockerfile
         args:
            VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}
            VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT}
      restart: unless-stopped
      environment:
         APP_DOMAIN: ${APP_DOMAIN}
      ports:
         - '80:80'
         - '443:443'
      depends_on:
         - app
      networks: [internal]
      volumes:
         - caddy_data:/data
         - caddy_config:/config

networks:
   internal:

volumes:
   pgdata:
   caddy_data:
   caddy_config:
